name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # GPU tests skip themselves when no hardware GPU is available; tests that need
      # the example images (`--ignored`) only run locally.
      - run: cargo test --workspace
      - run: cargo build --release -p shroom-ui -p shroom-cli
      # Artifacts are zipped, which loses the executable flag, so macOS and Linux
      # binaries are packed as .tar.gz first.
      - name: Package binaries
        shell: bash
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            Windows)
              cp target/release/shroom-stack.exe target/release/shroom.exe dist/
              ;;
            macOS)
              scripts/bundle-macos.sh
              cp target/release/shroom target/bundle/
              tar -czf dist/shroom-stack-macos.tar.gz -C target/bundle "Shroom Stack.app" shroom
              ;;
            Linux)
              tar -czf dist/shroom-stack-linux.tar.gz -C target/release shroom-stack shroom
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: shroom-stack-${{ runner.os }}
          path: dist/
          if-no-files-found: error
