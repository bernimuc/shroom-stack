name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # GPU tests skip themselves when no hardware GPU is available; tests that need
      # the example images (`--ignored`) only run locally.
      - run: cargo test --workspace
      - run: cargo build --release -p shroom-ui -p shroom-cli
      # Each package holds the binaries, the license files and the licenses of all linked
      # crates. Artifacts are zipped, which loses the executable flag, so macOS and Linux
      # packages are .tar.gz files.
      - name: Package binaries
        shell: bash
        run: |
          mkdir dist pkg
          # On Windows, python3 may be the Microsoft Store placeholder.
          if [ "$RUNNER_OS" = Windows ]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" scripts/third-party-licenses.py -o pkg/THIRD-PARTY-LICENSES.txt
          cp LICENSE-MIT LICENSE-APACHE pkg/
          case "$RUNNER_OS" in
            Windows)
              cp target/release/shroom-stack.exe target/release/shroom.exe pkg/
              cp pkg/* dist/
              ;;
            macOS)
              scripts/bundle-macos.sh
              cp -R "target/bundle/Shroom Stack.app" target/release/shroom pkg/
              tar -czf dist/shroom-stack-macos.tar.gz -C pkg .
              ;;
            Linux)
              cp target/release/shroom-stack target/release/shroom pkg/
              tar -czf dist/shroom-stack-linux.tar.gz -C pkg .
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: shroom-stack-${{ runner.os }}
          path: dist/
          if-no-files-found: error
