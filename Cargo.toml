[workspace]
resolver = "3"
members = ["crates/shroom-core", "crates/shroom-cli", "crates/shroom-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shroom-core = { path = "crates/shroom-core" }
anyhow = "1"
thiserror = "2"

[profile.dev.package."*"]
# Image processing is unbearably slow unoptimised; keep our own code debuggable.
opt-level = 3

[profile.release]
debug = 1
